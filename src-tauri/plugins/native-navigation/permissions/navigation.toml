[[permission]]
identifier = "allow-navigation"
description = "Allows the main journal to attach, synchronize and detach its native navigation."
commands.allow = ["attach", "update", "detach", "attachTabs", "updateTabs"]

[[permission]]
identifier = "allow-haptics"
description = "Allows light interaction feedback on supported iOS devices."
commands.allow = ["hapticFeedback"]

[[permission]]
identifier = "allow-modal-interaction"
description = "Temporarily constrains WebView scroll and zoom gestures while a modal is open."
commands.allow = ["setModalInteraction"]
