[package]
name = "tauri-plugin-audio-player"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-audio-player"
[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
[dependencies]
tauri = "2.12.5"
serde_json = "1.0.154"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
souvlaki = { version = "=0.9.3", default-features = false, features = ["use_zbus"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
