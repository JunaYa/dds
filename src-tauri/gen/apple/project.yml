name: dds
options:
  bundleIdPrefix: com.dds.app
  deploymentTarget:
    iOS: 16.4
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settings:
  base:
    DDS_APP_IDENTIFIER: com.dds.app
settingGroups:
  app:
    base:
      SWIFT_VERSION: "5.0"
      PRODUCT_NAME: dds
      PRODUCT_BUNDLE_IDENTIFIER: $(DDS_APP_IDENTIFIER)
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  RecentRecord:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - RecentRecord/OpenRecentRecord.swift
      - RecentRecord/RecentRecordWidget.swift
      - ../../plugins/native-navigation/ios/Sources/RecentRecordSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DDS_APP_IDENTIFIER).RecentRecord
        INFOPLIST_FILE: RecentRecord/Info.plist
        CODE_SIGN_ENTITLEMENTS: RecentRecord/RecentRecord.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 0.1.0
  dds_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: RecentRecord/OpenRecentRecord.swift
      - path: ../../plugins/native-navigation/ios/Sources/RecentRecordSnapshot.swift
      - path: ../../plugins/native-navigation/ios/Sources/SiriInbox.swift
      - path: Assets.xcassets
      - path: Externals
      - path: dds_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: dds_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: 连接同一网络中的开发电脑，加载应用调试页面并实时更新。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    entitlements:
      path: dds_iOS/dds_iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.$(DDS_APP_IDENTIFIER)]
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: RecentRecord
        embed: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
