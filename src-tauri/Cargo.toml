[package]
name = "dds"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dds_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri-plugin-cloud-sync = { path = "plugins/cloud-sync" }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
chrono = "0.4.45"
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.0"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-native-navigation = { path = "plugins/native-navigation" }
